<!doctype html>
<!-- Tutorial thumbnail, 1280x720 (owner, 2026-11-04): the big orange mascot + the tool name, site look.
     Usage: chrome --headless --window-size=1280,720 --screenshot=thumb.png "file:///.../tools/tutorial-thumb.html?t=<line 1>&t2=<line 2>&s=<pill>"
     Fonts and the mascot are read from ../template. -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Heebo; src: url(../template/fonts/Heebo.ttf); font-weight: 100 900; }
  @font-face { font-family: Fredoka; src: url(../template/fonts/Fredoka.ttf); font-weight: 300 700; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: Heebo, sans-serif; color: #14162d; position: relative;
    background:
      radial-gradient(circle, rgba(20,22,45,.07) 2.2px, transparent 2.6px) 0 0 / 30px 30px,
      linear-gradient(225deg, #f4edff 0%, #fff1f5 55%, #fff4bb 100%);
  }
  .mascot { position: absolute; left: -10px; bottom: -20px; height: 700px; transform: rotate(-3deg); filter: drop-shadow(10px 12px 0 rgba(20,22,45,.18)); }
  .text { position: absolute; right: 56px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 22px; text-align: right; }
  .kicker { font: 800 44px Heebo; color: #686d87; }
  h1 { margin: 0; font: 900 118px/1.02 Heebo; letter-spacing: -1px; }
  h1 span { display: block; color: #cf2f56; }
  .pill { display: inline-block; padding: 12px 34px 16px; border: 5px solid #14162d; border-radius: 999px; box-shadow: 8px 9px 0 #14162d; font: 900 46px Heebo; }
  .blue { background: #226bd7; color: #fff; }
  .brand { position: absolute; left: 30px; top: 26px; padding: 6px 22px 10px; background: #fff4bb; border: 4px solid #14162d; border-radius: 999px; box-shadow: 6px 7px 0 #14162d; font: 900 34px Heebo; }
</style>
</head>
<body>
  <img class="mascot" src="../template/img/mascot.png" alt="">
  <div class="brand">עוגה בוגה</div>
  <div class="text">
    <div class="kicker" id="k">איך משתמשים?</div>
    <h1 id="t"></h1>
    <div class="pill blue" id="s"></div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('t').innerHTML = (q.get('t') || 'שם הכלי').replace(/</g, '&lt;') + (q.get('t2') ? '<span>' + q.get('t2').replace(/</g, '&lt;') + '</span>' : '');
  document.getElementById('s').textContent = q.get('s') || 'מדריך קצר';
  if (q.get('k')) document.getElementById('k').textContent = q.get('k');
</script>
</body>
</html>
