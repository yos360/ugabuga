<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Heebo;src:url(fonts/Heebo.ttf);font-weight:100 900}
*{box-sizing:border-box;margin:0}
body{width:1280px;height:720px;overflow:hidden;font-family:Heebo,sans-serif;background:#fffefa radial-gradient(rgba(20,22,45,.1) 2px,transparent 2.5px) 0 0/30px 30px;position:relative}
.m{position:absolute;left:10px;top:150px;height:470px}
.fl{position:absolute;left:390px;top:300px;width:250px;height:340px;border:5px solid #14162d;border-radius:18px;box-shadow:7px 8px 0 #14162d;background:#fff url(img/flag-0.png) no-repeat;background-size:350px auto;background-position:-25px -20px;transform:rotate(-6deg)}
.t{position:absolute;right:30px;top:80px;width:700px;text-align:center;white-space:nowrap}
h1{font-size:94px;line-height:1.05;font-weight:900;color:#cf2f56;text-shadow:6px 7px 0 #14162d}
.p{display:inline-block;margin-top:40px;background:#226bd7;color:#fff;font-size:44px;font-weight:900;padding:10px 34px;border:5px solid #14162d;border-radius:60px;box-shadow:7px 8px 0 #14162d;transform:rotate(-2deg)}
.f{display:inline-block;margin-top:30px;background:#fff4bb;font-size:42px;font-weight:900;padding:8px 30px;border:5px solid #14162d;border-radius:60px;box-shadow:6px 7px 0 #14162d;transform:rotate(2deg)}
</style></head><body>
<div class="fl"></div><img class="m" src="img/mascot.png">
<div class="t"><h1>קישוטי חנוכה<br>להדפסה</h1><div class="p">דגלונים, כרזה ושלט</div><br><div class="f">חינם, בלי הרשמה</div></div>
</body></html>
