    <!-- Self-heal: if a browser cached a broken copy of an app file (e.g. HTML saved
         under a .js URL during a deploy), the app never starts and nothing is
         clickable. On such a load failure, re-download the app files bypassing the
         cache and reload once. Runs before the app so it also covers the main file. -->
    <script>
      (function () {
        function heal(extra) {
          try { var last = +sessionStorage.getItem('uga-heal') || 0; if (Date.now() - last < 60000) return; sessionStorage.setItem('uga-heal', String(Date.now())) } catch (e) { return }
          var urls = [].map.call(document.querySelectorAll('script[type=module][src], link[rel=modulepreload][href]'), function (el) { return el.src || el.href })
          if (extra) urls.push(extra)
          urls = urls.filter(function (u) { return u.indexOf(location.origin + '/assets/') === 0 })
          Promise.all(urls.map(function (u) { return fetch(u, { cache: 'reload', credentials: 'same-origin' }).catch(function () {}) }))
            .then(function () { location.reload() })
        }
        window.__ugaHeal = heal
        window.addEventListener('error', function (e) {
          var t = e.target
          if (t && t.tagName === 'SCRIPT' && t.type === 'module' && !window.__UGA_BOOTED__) heal()
        }, true)
        window.addEventListener('vite:preloadError', function (e) {
          var m = String(e.payload && e.payload.message || '').match(/https?:\/\/\S+\.js/)
          e.preventDefault()
          heal(m && m[0])
        })
        window.addEventListener('load', function () {
          setTimeout(function () { if (!window.__UGA_BOOTED__) heal() }, 4000)
        })
      })()
    </script>

    <!-- Google Analytics: calls queue in dataLayer right away; the gtag library itself is fetched

    <script>
      window.dataLayer = window.dataLayer || [];
      // The owner's own browsing is left out — same rule as the site's own report (/admin/activity),
      // so the two count the same people. "Count me too" on that report turns it back on.
      try {
        if (localStorage.getItem('ugabuga-owner-auth')) localStorage.setItem('buga-owner-device', '1');
        if (localStorage.getItem('buga-owner-device') === '1' && localStorage.getItem('buga-track-self') !== '1') window['ga-disable-G-5XK1W5R504'] = true;
      } catch (e) {}
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // Campaign tags (?utm_source=qr from a printed page…) count once, for the landing, and are
      // then removed from the address bar — otherwise a link copied or shared afterwards carries
      // them on and every friend who opens it is counted as another QR scan.
      var landing = location.href;
      gtag('config', 'G-5XK1W5R504', { page_location: landing });
      try {
        var q = new URLSearchParams(location.search), utm = q.get('utm_source');
        if (utm) {
          sessionStorage.setItem('buga-landing-utm', utm);
          var medium = q.get('utm_medium'); if (medium) sessionStorage.setItem('buga-landing-medium', medium);
          var content = q.get('utm_content'); if (content) sessionStorage.setItem('buga-landing-content', content);
          ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'].forEach(function (k) { q.delete(k); });
          var rest = q.toString();
          history.replaceState(history.state, '', location.pathname + (rest ? '?' + rest : '') + location.hash);
        }
      } catch (e) {}
      (function () {
        function load() { var s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=G-5XK1W5R504'; document.head.appendChild(s); }
        function idle() { if (window.requestIdleCallback) requestIdleCallback(load, { timeout: 3000 }); else setTimeout(load, 1500); }
        if (document.readyState === 'complete') idle(); else window.addEventListener('load', idle);
      })();
    </script>
