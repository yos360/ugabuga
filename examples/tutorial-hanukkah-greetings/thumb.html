<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Heebo;src:url(fonts/Heebo.ttf);font-weight:100 900}
*{box-sizing:border-box;margin:0}
body{width:1280px;height:720px;overflow:hidden;font-family:Heebo,sans-serif;background:#fffefa radial-gradient(rgba(20,22,45,.1) 2px,transparent 2.5px) 0 0/30px 30px;position:relative}
.m{position:absolute;left:290px;bottom:-10px;height:420px}
.b{position:absolute;left:50px;top:40px;width:330px;height:440px;transform:rotate(-6deg);border:5px solid #14162d;border-radius:12px;box-shadow:9px 10px 0 #14162d;background:#fff url(img/b1.png) no-repeat;background-size:1100px auto;background-position:-176px -118px}
.t{position:absolute;right:40px;top:70px;width:640px;text-align:center}
h1{font-size:118px;line-height:1.02;font-weight:900;color:#cf2f56;text-shadow:6px 7px 0 #14162d}
.p{display:inline-block;margin-top:34px;background:#226bd7;color:#fff;font-size:50px;font-weight:900;padding:10px 38px;border:5px solid #14162d;border-radius:60px;box-shadow:7px 8px 0 #14162d;transform:rotate(-2deg)}
.f{display:inline-block;margin-top:30px;background:#fff4bb;font-size:40px;font-weight:900;padding:8px 28px;border:5px solid #14162d;border-radius:60px;box-shadow:6px 7px 0 #14162d;transform:rotate(2deg)}
</style></head><body>
<div class="b"></div><img class="m" src="img/mascot.png">
<div class="t"><h1>ברכות<br>לחנוכה</h1><div class="p">לגננת, למורה ולמשפחה</div><br><div class="f">מעתיקים או מדפיסים כרטיס</div></div>
</body></html>
