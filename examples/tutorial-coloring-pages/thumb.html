<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Heebo;src:url(fonts/Heebo.ttf);font-weight:100 900}
*{box-sizing:border-box;margin:0}
body{width:1280px;height:720px;overflow:hidden;font-family:Heebo,sans-serif;background:#fffefa radial-gradient(rgba(20,22,45,.1) 2px,transparent 2.5px) 0 0/30px 30px;position:relative}
.m{position:absolute;left:150px;bottom:20px;height:430px}
.art{position:absolute;left:40px;top:56px;width:300px;height:300px;background:#fff;border:5px solid #14162d;border-radius:18px;box-shadow:8px 9px 0 #14162d;transform:rotate(-5deg);overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover}
.t{position:absolute;right:46px;top:110px;width:700px;text-align:center;white-space:nowrap}
h1{font-size:124px;line-height:1.02;font-weight:900;color:#cf2f56;text-shadow:6px 7px 0 #14162d}
.p{display:inline-block;margin-top:30px;background:#226bd7;color:#fff;font-size:52px;font-weight:900;padding:10px 38px;border:5px solid #14162d;border-radius:60px;box-shadow:7px 8px 0 #14162d;transform:rotate(-2deg)}
.f{display:inline-block;margin-top:26px;background:#fff4bb;font-size:40px;font-weight:900;padding:8px 28px;border:5px solid #14162d;border-radius:60px;box-shadow:6px 7px 0 #14162d;transform:rotate(2deg)}
</style></head><body>
<div class="art"><img src="img/thumbart.png"></div>
<img class="m" src="img/mascot.png">
<div class="t"><h1>דפי צביעה<br>להדפסה</h1><div class="p">יותר מ־1,000 ציורים</div><br><div class="f">חינם · דף A4 · גם PDF</div></div>
</body></html>
