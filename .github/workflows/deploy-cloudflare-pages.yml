name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f2491a7809d71c149a38c8f2a16a716d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare deployment access
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN"
            echo "Create a Cloudflare API token with Pages:Edit permission for this account."
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      # Snapshot the sitemap that is live right now (before this deploy replaces it),
      # so the IndexNow step below can submit only the pages that are new or changed.
      - name: Snapshot live sitemap (IndexNow baseline)
        run: curl -fsS --max-time 30 https://ugabuga.co.il/sitemap.xml -o "$RUNNER_TEMP/sitemap-before.xml" || echo "Could not fetch live sitemap; IndexNow will skip this run."

      - name: Publish production site
        run: npx wrangler@4 pages deploy dist --project-name=ugabuga --branch=main

      # Tell Bing (and so ChatGPT search) about new/changed pages. Never fails the deploy.
      - name: Submit new/changed pages to IndexNow
        continue-on-error: true
        env:
          BASELINE_SITEMAP: ${{ runner.temp }}/sitemap-before.xml
        run: sleep 20 && node scripts/indexnow-submit.mjs
