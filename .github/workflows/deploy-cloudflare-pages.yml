name: Deploy to Cloudflare Pages

# Builds the site here (6 h job limit) and uploads it with wrangler, instead of Cloudflare's own build,
# which kills builds past ~35 minutes. Until the CLOUDFLARE_API_TOKEN secret exists every step is
# skipped, so a push only shows a skipped run, never a failure; Cloudflare's own build keeps deploying.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  # Let a running deploy finish; only the newest waiting push runs after it.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f2491a7809d71c149a38c8f2a16a716d
    steps:
      - name: No token yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; Cloudflare's own build deploys this push."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm

      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      # The prerender step drives headless Chromium, which needs its system libraries on Ubuntu.
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx playwright install --with-deps chromium
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build

      # Run from the repo root so wrangler also bundles ./functions (the /api Pages Functions).
      - name: Publish production site
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler@4 pages deploy dist --project-name=ugabuga --branch=main --commit-hash=${{ github.sha }}
