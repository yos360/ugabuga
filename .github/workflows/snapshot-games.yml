name: Snapshot games database
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/snapshot-games.mjs', '.github/workflows/snapshot-games.yml']
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/snapshot-games.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain public/data/games-snapshot.json)" ]; then
            git config user.name "games-snapshot-bot"
            git config user.email "actions@users.noreply.github.com"
            git add public/data/games-snapshot.json
            git commit -m "Update games snapshot"
            git push
          fi
