# Checks every change before it reaches the live site (Cloudflare builds from main):
# lint, unit tests and the full production build, isolated from live services.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Lint
        run: npx oxlint
      - name: Tests
        run: node --test tests/*.mjs
      - name: Install build browser
        run: npx playwright install --with-deps chromium
      - name: Full offline build and prerender
        run: npm run build
        env:
          SITEMAP_OFFLINE: '1'
          PRERENDER_OFFLINE: '1'
          PRERENDER_CONCURRENCY: '4'
