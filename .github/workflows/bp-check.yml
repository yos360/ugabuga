name: BugaPedia live answers check
on:
  push:
    branches: [bp-check]
jobs:
  ask:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/bpeval/live.mjs ${{ matrix.shard }} 2
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: scripts/bpeval/live/shard-${{ matrix.shard }}.json
  save:
    needs: ask
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: scripts/bpeval/live
          merge-multiple: true
      - run: |
          git config user.name bp-check; git config user.email actions@users.noreply.github.com
          git add scripts/bpeval/live && git commit -m "live results [skip ci]" && git push origin HEAD:bp-check
